name: Hebrew semantic model binary reproducibility - NO APK
on:
  push:
    branches: [feature/mishneh-torah-search-100qa]
    paths:
      - scripts/build_semantic_index.py
      - .github/workflows/mishneh-semantic-reproducibility.yml
  workflow_dispatch:
jobs:
  reproducible-offline-hebrew-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned model dependencies
        run: python -m pip install requests==2.32.3 numpy==2.1.3 scipy==1.14.1 gensim==4.4.0
      - name: Build the original authentic corpus exactly once
        run: python scripts/build_corpus.py
      - name: Train local Hebrew embeddings from scratch, first run
        run: |
          python scripts/build_semantic_index.py
          sha256sum app/src/main/assets/hebrew_semantic.bin | tee /tmp/hebrew_model_first.sha
          cp app/src/main/assets/hebrew_semantic.bin /tmp/rambam_semantic_first.bin
      - name: Train local Hebrew embeddings from scratch, independent second run
        run: |
          python scripts/build_semantic_index.py
          sha256sum app/src/main/assets/hebrew_semantic.bin | tee /tmp/hebrew_model_second.sha
      - name: Require byte-for-byte deterministic source-only embeddings
        run: |
          cmp /tmp/rambam_semantic_first.bin app/src/main/assets/hebrew_semantic.bin
          diff -u /tmp/hebrew_model_first.sha /tmp/hebrew_model_second.sha
          echo "HEBREW_SEMANTIC_REPRODUCIBLE=YES apk_created=false"
      - name: Preserve model integrity proof only, not user-installable output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hebrew-semantic-two-train-sha256-proof-NO-APK
          path: |
            /tmp/hebrew_model_first.sha
            /tmp/hebrew_model_second.sha
            artifacts/semantic_report.json
          retention-days: 30
          if-no-files-found: warn
