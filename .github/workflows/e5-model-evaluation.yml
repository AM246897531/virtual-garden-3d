name: Experimental Hebrew semantic model source-grounded evaluation
on:
  push:
    branches: [feature/mishneh-torah-offline-android]
    paths: [.github/workflows/e5-model-evaluation.yml, scripts/evaluate_e5_110.py]
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local evaluation dependencies
        run: python -m pip install requests==2.32.3 numpy==2.1.3 onnxruntime==1.20.1 transformers==4.46.3 huggingface_hub==0.26.5
      - name: Rebuild public-domain source corpus and passage index
        run: |
          python scripts/build_corpus.py
          python scripts/build_passage_index.py
      - name: Evaluate real Hebrew semantic retrieval against frozen 110-question benchmark
        run: |
          mkdir -p artifacts
          set -o pipefail
          python -u scripts/evaluate_e5_110.py | tee artifacts/e5-model-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rambam-External-Model-Evaluation
          path: artifacts/e5-model-probe*
          if-no-files-found: warn
          retention-days: 7
