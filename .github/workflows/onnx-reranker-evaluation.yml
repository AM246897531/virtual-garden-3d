name: Experimental multilingual Hebrew reranker ONNX 110
on:
  push:
    branches: [feature/mishneh-torah-offline-android]
    paths:
      - scripts/evaluate_onnx_reranker_110.py
      - .github/workflows/onnx-reranker-evaluation.yml
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic CPU evaluation libraries
        run: pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.6.1 onnxruntime==1.22.1 transformers==4.51.3 huggingface_hub==0.30.2 requests==2.32.3
      - name: Build full licensed corpus and source-aligned passage index
        run: |
          python scripts/build_corpus.py
          python scripts/build_passage_index.py
      - name: Run frozen source-grounded accuracy benchmark, no target hints
        run: |
          mkdir -p artifacts
          set -o pipefail
          python -u scripts/evaluate_onnx_reranker_110.py | tee artifacts/rerank-onnx-110.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rambam-ONNX-CrossEncoder-110
          path: artifacts/rerank-onnx-110*
          if-no-files-found: warn
          retention-days: 7
