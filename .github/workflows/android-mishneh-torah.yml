name: Build full offline Mishneh Torah Android
on:
  push:
    branches:
      - feature/mishneh-torah-offline-android
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install corpus build dependency
        run: python -m pip install requests==2.32.3 numpy==2.1.3 scipy==1.14.1 gensim==4.4.0
      - name: Test Hebrew normalization
        run: python scripts/test_corpus_utils.py
      - name: Download and verify FULL public-domain Hebrew corpus; prebuild FTS index
        run: python scripts/build_corpus.py
      - name: Build passage-level evidence index for precise matching and highlighting
        run: python scripts/build_passage_index.py
      - name: Verify precise source offsets and passage index integrity
        run: python scripts/test_passage_index.py
      - name: Train and package tiny 100-percent-offline Hebrew embedding model
        run: python scripts/build_semantic_index.py
      - name: Verify local learned model and search results
        run: python scripts/test_semantic_index.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable hardware acceleration for Android emulator
        run: sudo chmod 666 /dev/kvm || true
      - name: Real Android emulator smoke test and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: false
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/capture.sh
      - name: Collect hashes and bundle metadata
        if: success()
        run: |
          mkdir -p artifacts/delivery
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/delivery/MishnehTorah-Offline-Android-debug.apk
          cp artifacts/SOURCE_MANIFEST.json artifacts/delivery/
          cp artifacts/corpus_report.json artifacts/delivery/
          cp artifacts/semantic_report.json artifacts/delivery/
          cp app/src/main/assets/hebrew_semantic.bin artifacts/delivery/
          cp app/src/main/assets/rambam.sqlite artifacts/delivery/
          git archive --format=zip -o artifacts/delivery/MishnehTorah-Android-Source.zip HEAD
          cp ATTRIBUTION_AND_LICENSES.md artifacts/delivery/
          cp scripts/quality_full_110.json artifacts/delivery/
          if [ -f artifacts/screenshots/quality-110-log.txt ]; then cp artifacts/screenshots/quality-110-log.txt artifacts/delivery/; fi
          if [ -d artifacts/screenshots ]; then (cd artifacts && zip -q -r delivery/Screenshots-Real-Android.zip screenshots); fi
          printf "Build: GitHub Actions; Gradle 8.10.2; JDK 17; Android 35.\nAPK: signed Android debug APK.\nSemantic model: INCLUDED (locally trained Hebrew embeddings, bundled as hebrew_semantic.bin).\nSee corpus_report.json for actual completeness.\n" > artifacts/delivery/BUILD_AND_TEST_REPORT.md
          if [ -f artifacts/screenshots/01-home.png ]; then echo "Emulator screenshot capture executed; examine PNGs and logcat for runtime verification." >> artifacts/delivery/BUILD_AND_TEST_REPORT.md; else echo "No emulator screenshots captured: runtime remains unverified." >> artifacts/delivery/BUILD_AND_TEST_REPORT.md; fi
          (cd artifacts && zip -q -r delivery/Rambam-Licensed-Raw-Corpus.zip raw-corpus)
          (cd artifacts/delivery && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mishneh-Torah-Build-Results
          path: |
            artifacts/delivery/
            artifacts/screenshots/
            artifacts/corpus_report.json
            artifacts/SOURCE_MANIFEST.json
          if-no-files-found: warn
          retention-days: 14