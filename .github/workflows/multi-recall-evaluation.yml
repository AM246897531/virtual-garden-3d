name: Offline multi-route Hebrew recall audit (110)
on:
  push:
    branches: [feature/mishneh-torah-offline-android]
    paths:
      - scripts/evaluate_multi_recall_110.py
      - .github/workflows/multi-recall-evaluation.yml
  workflow_dispatch:
jobs:
  recall:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install search evaluation packages
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.6.1 requests==2.32.3
      - name: Recreate the licensed Rambam corpus with source offsets
        run: |
          python scripts/build_corpus.py
          python scripts/build_passage_index.py
      - name: Evaluate frozen questions without reading expected sources in candidate generation
        run: python -u scripts/evaluate_multi_recall_110.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rambam-Multi-Route-110-Candidate-Coverage
          path: artifacts/multi-recall-110.json
          if-no-files-found: warn
          retention-days: 14
