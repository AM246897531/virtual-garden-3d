name: Experimental BGE large multilingual Hebrew source reranker
on:
  push:
    branches: [feature/mishneh-torah-offline-android]
    paths:
      - scripts/evaluate_bge_110.py
      - .github/workflows/bge-reranker-evaluation.yml
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.6.1 onnxruntime==1.22.1 transformers==4.51.3 huggingface_hub==0.30.2 sentencepiece==0.2.0
      - name: Reconstruct source-text index
        run: |
          python scripts/build_corpus.py
          python scripts/build_passage_index.py
      - name: Evaluate frozen 110 without target hints
        run: |
          set -o pipefail
          python -u scripts/evaluate_bge_110.py | tee bge-110.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rambam-BGE-Reranker-110
          path: |
            bge-110.log
            artifacts/bge-110.json
          retention-days: 14
          if-no-files-found: warn
