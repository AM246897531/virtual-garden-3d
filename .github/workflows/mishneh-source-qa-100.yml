name: Verify 100 free-form gold sources (PYTHON ONLY - NO APK BUILD)
on:
  push:
    branches: [feature/mishneh-torah-search-100qa]
    paths:
      - scripts/quality_natural_100.json
      - scripts/validate_natural_100.py
      - scripts/test_natural_query_semantics.py
      - scripts/test_char_trigram_100.py
      - scripts/test_char_trigram_bridges_100.py
      - scripts/test_verbose_query_recall_100.py
      - scripts/build_char_trigram_index.py
      - scripts/build_gold_answer_offsets.py
      - .github/workflows/mishneh-source-qa-100.yml
  workflow_dispatch:
jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install text corpus fetch dependency
        run: python -m pip install requests==2.32.3 'scikit-learn>=1.5,<2' 'numpy>=1.26,<3'
      - name: Rebuild original Mishneh Torah corpus - no Gradle or Android compilation
        run: python scripts/build_corpus.py
      - name: Build 15MB offline source-only character-recall index
        run: python scripts/build_char_trigram_index.py
      - name: Verify character index binary and 100 natural-language source recall
        run: python scripts/test_char_trigram_100.py
      - name: Verify 100 plus 30 additional source-recall questions with vocabulary bridges
        run: python scripts/test_char_trigram_bridges_100.py
      - name: Stress-test retrieval for 100 short and 300 verbose conversational questions
        run: python scripts/test_verbose_query_recall_100.py
      - name: Confirm early-versus-late Hebrew time intent and unmodified evidence offsets
        run: python scripts/test_natural_query_semantics.py
      - name: Validate 100 question references and verbatim answer-anchor text
        run: python scripts/validate_natural_100.py
      - name: Derive 100 exact answer-phrase locations in original UTF-16 texts
        run: python scripts/build_gold_answer_offsets.py
      - name: Upload source-only QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mishneh-Torah-Gold-100-Python-Only
          path: |
            artifacts/natural_100_gold_validation.json
            artifacts/corpus_report.json
            artifacts/char3_report.json
            artifacts/gold_answer_offsets_100.json
          retention-days: 30
          if-no-files-found: warn
