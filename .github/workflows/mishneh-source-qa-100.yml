name: Verify source QA + held-out Hebrew E5 experiment (NO APK)
on:
  push:
    branches: [feature/mishneh-torah-search-100qa]
    paths:
      - app/src/main/java/app/mishnehtorah/SearchLanguage.kt
      - app/src/main/java/app/mishnehtorah/PreciseEvidenceSearch.kt
      - app/src/main/java/app/mishnehtorah/CorpusStore.kt
      - app/src/main/java/app/mishnehtorah/SemanticIndex.kt
      - app/src/main/java/app/mishnehtorah/CharTrigramIndex.kt
      - app/src/main/java/app/mishnehtorah/MainActivity.kt
      - scripts/quality_natural_100.json
      - scripts/validate_natural_100.py
      - scripts/test_natural_query_semantics.py
      - scripts/test_char_trigram_100.py
      - scripts/test_char_trigram_bridges_100.py
      - scripts/test_verbose_query_recall_100.py
      - scripts/test_focused_conversation_100.py
      - scripts/test_contrastive_nonopening_100.py
      - scripts/test_char_trigram_holdout40.py
      - scripts/test_fts_char_holdout40.py
      - scripts/build_quality_500.py
      - scripts/test_quality_500_baseline.py
      - scripts/quality_holdout_nonopening_40.json
      - scripts/validate_holdout_nonopening_40.py
      - scripts/verify_android_100_accuracy.py
      - scripts/test_strict_android_gate.py
      - scripts/check_kotlin_syntax_no_compile.py
      - scripts/experiment_multilingual_reranker_100.py
      - scripts/build_char_trigram_index.py
      - scripts/build_gold_answer_offsets.py
      - .github/workflows/mishneh-source-qa-100.yml
  workflow_dispatch:
jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install text corpus fetch dependency
        run: python -m pip install requests==2.32.3 'scikit-learn>=1.5,<2' 'numpy>=1.26,<3'
      - name: Install Kotlin grammar parser (NO Kotlin compiler)
        run: python -m pip install 'tree-sitter>=0.25,<0.27' 'tree-sitter-kotlin==1.1.0'
      - name: Parse changed Kotlin sources, no APK or compiler
        run: python scripts/check_kotlin_syntax_no_compile.py
      - name: Test strict Android acceptance parser with negative and stale cases (NO APK)
        run: python scripts/test_strict_android_gate.py
      - name: Rebuild original Mishneh Torah corpus - no Gradle or Android compilation
        run: python scripts/build_corpus.py
      - name: Build authentic source-passage FTS for independent candidate comparisons
        run: python scripts/build_passage_index.py
      - name: Build 15MB offline source-only character-recall index
        run: python scripts/build_char_trigram_index.py
      - name: Verify character index binary and 100 natural-language source recall
        run: python scripts/test_char_trigram_100.py
      - name: Verify 100 plus 30 additional source-recall questions with vocabulary bridges
        run: python scripts/test_char_trigram_bridges_100.py
      - name: Stress-test retrieval for 100 short and 300 verbose conversational questions
        run: python scripts/test_verbose_query_recall_100.py
      - name: Validate 400 natural and verbose questions retain every legal query term
        run: python scripts/test_focused_conversation_100.py
      - name: Audit 100 non-opening-law examples to detect benchmark first-law bias
        run: python scripts/test_contrastive_nonopening_100.py
      - name: Measure Top-K source candidate recall on 40 independent non-opening Hebrew questions
        run: python scripts/test_char_trigram_holdout40.py
      - name: Compare full passage FTS and character routes on 40 non-opening questions
        run: python scripts/test_fts_char_holdout40.py
      - name: Construct and verify 500 source-grounded QA cases (140 freeform, 360 explicitly synthetic)
        run: python scripts/build_quality_500.py
      - name: Evaluate independent 500-case Python Top1 source and verbatim highlight baseline
        run: python scripts/test_quality_500_baseline.py
      - name: Confirm early-versus-late Hebrew time intent and unmodified evidence offsets
        run: python scripts/test_natural_query_semantics.py
      - name: Verify 40 additional non-first-law free-form questions and their source anchors
        run: python scripts/validate_holdout_nonopening_40.py
      - name: Validate 100 question references and verbatim answer-anchor text
        run: python scripts/validate_natural_100.py
      - name: Derive 100 exact answer-phrase locations in original UTF-16 texts
        run: python scripts/build_gold_answer_offsets.py
      - name: Experimental Hebrew E5 model dependencies (explicit opt-in commit only)
        if: contains(github.event.head_commit.message, '[run-e5]') || contains(github.event.head_commit.message, '[run-cross]')
        run: |
          python -m pip install 'sentence-transformers>=3.4,<6' 'scikit-learn>=1.5,<2'
      - name: Benchmark pretrained small Hebrew E5 against 100 labeled sources (NO APK)
        if: contains(github.event.head_commit.message, '[run-e5]') || contains(github.event.head_commit.message, '[run-cross]')
        continue-on-error: true
        env:
          HEBREW_EMBED_MODEL: alphaedge-ai/multilingual-e5-small-heb-32768
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '4'
        run: python scripts/experiment_tiny_hebrew_e5_100.py
      - name: Install independent 141M multilingual ONNX reranker dependencies
        if: contains(github.event.head_commit.message, '[run-cross]')
        run: python -m pip install 'onnxruntime>=1.20,<2' 'transformers>=4.53,<5' 'huggingface_hub>=0.27,<1'
      - name: Score 100 source questions with quantized cross-encoder, no APK
        if: contains(github.event.head_commit.message, '[run-cross]')
        env:
          HEBREW_RERANK_MODEL: Horizon-Labs/multilingual-reranker-small
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '4'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/experiment_multilingual_reranker_100.py
      - name: Upload source-only QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mishneh-Torah-Gold-100-Python-Only
          path: |
            artifacts/natural_100_gold_validation.json
            artifacts/corpus_report.json
            artifacts/char3_report.json
            artifacts/gold_answer_offsets_100.json
            artifacts/contrastive_nonopening_100.json
            artifacts/holdout_nonopening_40_report.json
            artifacts/quality_500_gold.json
            artifacts/quality_500_description.json
            artifacts/quality_500_source_baseline.json
            artifacts/kotlin_parse_no_compile.json
            artifacts/experimental_e5_100.json
            artifacts/experimental_e5_scores_100.npz
            artifacts/experimental_multilingual_reranker_100.json
          retention-days: 30
          if-no-files-found: warn
